[package]
name = "quizlab-shell-ext"
version = "6.0.3"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "QuizLabShellExt"

[dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
  "implement",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }
