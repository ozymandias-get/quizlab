name: Build and Release

on:
  # CI is release-only: a normal branch push must not start this workflow.
  # Pushing a `v*` tag is the release path; manual dispatch keeps a way to
  # validate or rebuild without cutting a release.
  push:
    tags:
      - 'v*'
  # No `inputs`: the release version comes from the pushed tag, which
  # `ci:check-version` reconciles against package.json. An `inputs.version`
  # was declared here once and read by nothing, so it is gone.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm ci

      - name: Repository hygiene guard
        run: npm run ci:check-hygiene

      - name: Version consistency
        run: npm run ci:check-version

      # The Node floor and every direct dependency's declared range floor are
      # stated in more than one place. `npm update` rewrites only the lockfile,
      # so the manifest and the installed tree can drift apart with nothing
      # reporting it; this step is what reports it.
      - name: Declaration consistency
        run: npm run ci:check-declarations

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Architecture (dependency-cruiser)
        run: npm run analyze:architecture

      - name: CSS Lint
        run: npm run analyze:css

      - name: File Size Check
        continue-on-error: true
        run: npm run analyze:file-sizes

      # Blocking gate: knip exits non-zero on any unused export, type, file or
      # dependency. The command carries no --max-issues ceiling, so a red step
      # here means dead code exists, not that a budget was overspent.
      - name: Dead Code (knip)
        run: npm run analyze:knip

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: Type Coverage (guard)
        run: npm run analyze:types:ci

      - name: Spell Check (non-blocking)
        continue-on-error: true
        run: npm run analyze:spell:ci

      - name: Duplicate Code Detection
        run: npm run analyze:duplicates

      - name: Circular Dependency Check
        run: npm run analyze:circular

      # This job already runs on every release tag, so compile the same target
      # the packaging job uses before it starts. A failure here stops the release
      # at the quality gate instead of after the artifact build.
      - name: Build (renderer + backend)
        run: npm run build

      - name: Setup Python (Semgrep)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Semgrep
        # pydantic is pinned because semgrep 1.144.0 reaches into a private
        # pydantic symbol through its mcp dependency: pydantic 2.14.0 removed
        # `eval_type_backport` from `pydantic._internal._typing_extra`, so the
        # newest resolution makes `semgrep --version` exit 1 on an ImportError
        # before a single rule runs. Verified locally against both versions:
        # pydantic 2.13.5 starts, 2.14.0 does not. Remove the pin once the
        # semgrep release we track stops importing it.
        run: >-
          python -m pip install --disable-pip-version-check
          semgrep==1.144.0 "pydantic<2.14"

      - name: Semgrep (production sources)
        run: npm run analyze:semgrep

      - name: Production Dependency Audit
        run: npm run check:audit

      - name: Electron Hardening (Electronegativity)
        run: npm run check:electron-security

  # The declared range in package.json admits two majors: the 24.x floor the
  # `quality` job pins, and 26.x+. README and CONTRIBUTING promise both, but
  # only the floor is exercised above. This job runs the same install,
  # typecheck and test path on 26 so the upper branch cannot rot unnoticed.
  # `build` depends on it, so a failure here blocks the release rather than
  # sitting beside it as an advisory signal.
  quality-node-26:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm test

  build:
    needs: [quality, quality-node-26]
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-22.04
            platform: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 rpm

      - name: Install dependencies
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          node --version
          npm --version
          npm ci

      - name: Install dependencies
        if: matrix.platform != 'win'
        run: |
          node --version
          npm --version
          npm ci

      - name: Build and Package (Windows)
        if: matrix.platform == 'win'
        run: npm run build && npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Package (Linux)
        if: matrix.platform == 'linux'
        run: npm run build && npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: 'electron-builder'

      - name: List release files (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          if (Test-Path release) { Get-ChildItem -Recurse release }

      - name: List release files (Linux)
        if: matrix.platform != 'win'
        run: |
          if [ -d release ]; then
            ls -laR release
          fi

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            release/*.exe
            release/*.yml
            release/latest.yml
          if-no-files-found: error

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/latest-linux.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: List downloaded files
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Quizlab Reader ${{ github.ref_name }}

            ### Download

            **Windows:** `QuizLab-Setup-*-x64.exe` — run the installer (per-user, no admin required).

            **Linux:** `*.AppImage` (run directly) or `*.deb` (install with dpkg).

            ### Core Features
            - **Embedded AI panels** (ChatGPT, Gemini, Claude, and more)
            - **Magic Selector** for Universal AI Chat
            - **Multi-language support (EN, TR)**
            - **Dual-Pane PDF Reader**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
