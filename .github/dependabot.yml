version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 10
    groups:
      patch-and-minor:
        update-types:
          - minor
          - patch
      majors:
        update-types:
          - major
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - dependencies
